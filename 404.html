<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moved to DunGenAI</title>

<!-- pizzafleet.app now redirects to dungen.ai. Brandon, 2026-10-04, choosing
     between keeping the site and redirecting it: REDIRECT.

     GitHub Pages serves static files only and cannot send a 301, so this page is
     the redirect. Three layers, deliberately, because each one covers a different
     failure of the one above it:
       1. the inline script -- runs during parse, before anything paints, and is the
          only layer that can carry the path and hash across to the new host;
       2. the meta refresh -- fires when JavaScript is off or blocked. It is static,
          so it can only reach the dungen.ai home page, not the original path;
       3. the visible link -- the last resort, and the only thing a reader sees if
          both of the above are disabled.
     rel=canonical points search engines at dungen.ai. noindex keeps this stub itself
     out of results; the canonical is what passes the signal along.

     404.html in this repo is this same page with ONE deliberate difference: it drops the
     path and keeps only the hash. Pages serves 404.html for every path that does not exist
     HERE -- and a path that never existed on pizzafleet.app almost certainly does not exist
     on dungen.ai either, so carrying it over would turn one 404 into another. Sending those
     visitors to the home page lands them somewhere real.
     CNAME is untouched: pizzafleet.app must keep resolving here for any of this to run. -->

<link rel="canonical" href="https://dungen.ai/" />
<meta name="robots" content="noindex" />
<meta http-equiv="refresh" content="0; url=https://dungen.ai/" />
<script>
  (function () {
    // Never redirect to ourselves: if this file is ever served from dungen.ai
    // (copied, proxied, previewed) the replace below would loop forever.
    if (location.hostname === 'dungen.ai') return;
    // Home page plus the hash only -- see the note above on why the path is dropped here.
    location.replace('https://dungen.ai/' + location.hash);
  })();
</script>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; text-align: center;
    background: #04112b; color: #f6efe3;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    line-height: 1.6;
  }
  p { margin: 0 0 10px; }
  .eyebrow { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #74e0fc; }
  h1 { margin: 0 0 14px; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; }
  a { color: #74e0fc; }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Pizza Fleet is now DunGenAI</p>
    <h1>Moved to dungen.ai</h1>
    <p>Taking you there now. If nothing happens, <a href="https://dungen.ai/">continue to dungen.ai</a>.</p>
  </main>
</body>
</html>
